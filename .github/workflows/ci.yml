name: Deploy Blog

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Twice-daily check for future-dated posts that have become due since the last deploy
  schedule:
    - cron: "7 6,18 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # default value when not using subfolders
  # BUILD_PATH: subfolder

jobs:
  check-scheduled:
    name: Check for scheduled posts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Decide whether to deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SINCE=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          echo "Last successful deploy: ${SINCE:-never}"
          echo "deploy=$(SINCE="$SINCE" node scripts/check-scheduled-posts.js)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Build and Deploy
    needs: check-scheduled
    if: needs.check-scheduled.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Yarn
        run: corepack enable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Restored after the dependency cache so it overlays node_modules/.astro.
      # Keyed per run so it is re-saved every build; restore-keys picks up the most recent.
      - name: Cache build outputs (Astro images, OG images)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_PATH }}/node_modules/.astro
            ${{ env.BUILD_PATH }}/.og-cache
          key: ${{ runner.os }}-build-cache-${{ hashFiles('**/yarn.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-build-cache-${{ hashFiles('**/yarn.lock') }}-

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          npx playwright install-deps chromium
          npm install sharp
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        run: |
          yarn generate-json
          yarn astro check
          yarn astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
          yarn generate-og-images
        working-directory: ${{ env.BUILD_PATH }}

      - name: Smoke test build output
        run: yarn smoke-test
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-initial
          path: ${{ env.BUILD_PATH }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-initial
          reporting_interval: 1000
