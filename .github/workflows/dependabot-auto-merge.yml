name: Dependabot Auto-Merge

# Enables auto-merge for non-major Dependabot PRs. The merge only happens once
# the required status checks on the Main ruleset pass. No approval step: the
# ruleset doesn't require reviews, and Actions isn't allowed to approve PRs.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Approve and auto-merge
    runs-on: ubuntu-latest
    # Only run for PRs opened by Dependabot
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Majors (e.g. TypeScript 7, ESLint 10) often need code/config changes,
      # so leave them for a human. Auto-merge waits for the required status
      # checks on the Main ruleset (Verify Astro Build, Code Quality Checks).
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
